name: ci
# Builds both plugin flavors — mono (net472, BepInEx 5, refs fetched by
# prepare-refs.ps1 + committed compile-only UnityEngine stub) and il2cpp
# (net6.0, BepInEx 6, refs from the official BepInEx NuGet feed) — and
# runs the standalone smoke test. Pushes to main publish a CalVer release
# (bepinex_ogsa_telemetry-[YYYY.MM.DD]-win64.zip) with mono/ and il2cpp/
# subfolders — same handling as uevr-ogsa-ts / ue4ss-ogsa-ts.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Fetch BepInEx reference
        run: ./prepare-refs.ps1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build stub + mono plugin
        run: |
          dotnet build vendor/UnityEngineStub/UnityEngineStub.csproj --nologo
          dotnet build plugin/plugin.csproj --nologo -c Release
      - name: Build il2cpp plugin
        run: dotnet build plugin-il2cpp/plugin.csproj --nologo -c Release
      - name: Build + run smoke test
        run: |
          dotnet build Smoke/Smoke.csproj --nologo
          dotnet run --project Smoke --no-build
      - name: Stage release layout
        run: |
          New-Item dist/mono, dist/il2cpp -ItemType Directory -Force | Out-Null
          # mono: every dependency DLL rides along except our compile-only
          # UnityEngine stub (defensive — Private=false already keeps it out)
          Copy-Item plugin/bin/Release/*.dll dist/mono/ -Exclude UnityEngine.dll
          # il2cpp: serializer closure only; the BepInEx/interop refs are
          # compile-only and never reach bin. deps.json is noise for BepInEx.
          Copy-Item plugin-il2cpp/bin/Release/*.dll dist/il2cpp/
          Remove-Item dist/il2cpp/*.deps.json -ErrorAction SilentlyContinue
          foreach ($f in 'dist/mono/ogsa_telemetry.dll',
                        'dist/mono/Capnp.Net.Runtime.dll',
                        'dist/il2cpp/ogsa_telemetry.dll',
                        'dist/il2cpp/Capnp.Net.Runtime.dll') {
            if (-not (Test-Path $f)) { throw "$f missing from build output" }
          }
        shell: pwsh
      - name: Upload plugin artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ogsa-telemetry-plugins
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-smoke
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download plugin artifact
        uses: actions/download-artifact@v8
        with:
          name: ogsa-telemetry-plugins
      - name: CalVer tag
        id: calver
        shell: bash
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag="$base.${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          TAG: ${{ steps.calver.outputs.tag }}
        shell: pwsh
        run: |
          $name = "bepinex_ogsa_telemetry-$($env:TAG.TrimStart('v'))-win64.zip"
          # artifact preserves the staged layout: mono/ + il2cpp/ subfolders,
          # one per game scripting backend; users drop the one they need into
          # the matching BepInEx's plugins folder
          if (-not (Test-Path mono/ogsa_telemetry.dll)) { throw "mono/ogsa_telemetry.dll missing from artifact" }
          if (-not (Test-Path il2cpp/ogsa_telemetry.dll)) { throw "il2cpp/ogsa_telemetry.dll missing from artifact" }
          Compress-Archive -Path 'README.md','mono','il2cpp' -DestinationPath $name
          "zip=$name" >> $env:GITHUB_ENV
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.calver.outputs.tag }}
          name: ${{ steps.calver.outputs.tag }}
          files: ${{ env.zip }}
          generate_release_notes: true
